# ============================================================
# VRIKSHAM - Docker Compose Dev Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ============================================================

version: "3.9"

services:
  # ----------------------------------------------------------
  # Frontend - Dev mode with hot reload
  # ----------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      target: deps
    container_name: vriksham-frontend-dev
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=dev-secret-change-in-production
      - WATCHPACK_POLLING=true
    volumes:
      - ../frontend/src:/app/src:delegated
      - ../frontend/public:/app/public:delegated
      - ../frontend/next.config.js:/app/next.config.js
      - ../frontend/tailwind.config.ts:/app/tailwind.config.ts
      - ../frontend/postcss.config.js:/app/postcss.config.js
      - ../frontend/tsconfig.json:/app/tsconfig.json
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # ----------------------------------------------------------
  # Backend - Dev mode with hot reload
  # ----------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      target: deps
    container_name: vriksham-backend-dev
    command: npm run dev
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/vriksham?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev-jwt-secret-change-in-production
      - JWT_EXPIRES_IN=7d
      - JWT_REFRESH_SECRET=dev-refresh-secret-change-in-production
      - JWT_REFRESH_EXPIRES_IN=30d
      - FRONTEND_URL=http://localhost:3000
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - LOG_LEVEL=debug
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=1000
    volumes:
      - ../backend/src:/app/src:delegated
      - ../backend/prisma:/app/prisma:delegated
      - ../backend/tsconfig.json:/app/tsconfig.json
      - backend-node-modules:/app/node_modules
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # ----------------------------------------------------------
  # PostgreSQL - Dev (exposed with defaults)
  # ----------------------------------------------------------
  postgres:
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=vriksham

  # ----------------------------------------------------------
  # Redis - Dev (exposed with defaults)
  # ----------------------------------------------------------
  redis:
    ports:
      - "6379:6379"

volumes:
  frontend-node-modules:
  frontend-next:
  backend-node-modules:
